# .github/workflows/ci.yml
#
# Runs on every pull request targeting main, and on direct pushes to main.
# Steps:
#   1. Checkout
#   2. Set up Python 3.12 + Poetry with layer caching
#   3. Install dev dependencies
#   4. inv lint  (ruff check)
#   5. inv test --unit
#   6. inv test --integration

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: "2.1.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: poetry install --without deepface

      - name: Generate test secrets
        run: |
          echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV
          echo "DUO_INTEGRATION_KEY=test_ikey" >> $GITHUB_ENV
          echo "DUO_SECRET_KEY=test_skey" >> $GITHUB_ENV
          echo "DUO_API_HOST=api-test.duosecurity.com" >> $GITHUB_ENV

      - name: Lint (ruff)
        run: poetry run inv lint

      - name: Unit tests
        run: poetry run inv test --unit

      - name: Integration tests
        run: poetry run inv test --integration
