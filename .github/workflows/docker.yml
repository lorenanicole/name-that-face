# .github/workflows/docker.yml
#
# Builds and pushes both Docker images to the GitHub Container Registry (ghcr.io)
# on every push to main (i.e. after a PR is merged and CI passes).
#
# Images published:
#   ghcr.io/lorenanicole/name-that-face-api:<sha>    (+ :latest on main)
#   ghcr.io/lorenanicole/name-that-face-client:<sha> (+ :latest on main)
#
# The API image uses a multi-stage build — the first stage installs TensorFlow
# and DeepFace (~2 GB), so this job can take 10-15 min on first run.
# Subsequent runs are much faster thanks to GitHub's layer cache (cache-from/to).

name: Docker

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/lorenanicole/name-that-face-api
  CLIENT_IMAGE: ghcr.io/lorenanicole/name-that-face-client

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ──────────────────────────────────────────────────────
      - name: Extract metadata for API image
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: name-that-face/Dockerfile
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # ── Client image ───────────────────────────────────────────────────
      - name: Extract metadata for client image
        id: client-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: name-that-face/Dockerfile.client
          push: true
          tags: ${{ steps.client-meta.outputs.tags }}
          labels: ${{ steps.client-meta.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
