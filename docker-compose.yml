# =============================================================================
# docker-compose.yml — Name-that-face
#
# Services:
#   api     — FastAPI server (port 8000)
#   client  — Streamlit front-end (port 8501)
#
# Usage:
#   docker compose up --build          # first run
#   docker compose up                  # subsequent runs (uses cached image)
#   docker compose down                # stop and remove containers
#
# For ngrok: run ngrok separately against port 8501 (see README).
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: name-that-face-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEEPFACE_PYTHON: /opt/deepface-venv/bin/python
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      # Audit log path inside the container (mapped to ./logs on the host)
      AUDIT_LOG_PATH: /app/logs/audit_log.jsonl
    volumes:
      # Persist audit logs and DeepFace model weights across restarts
      - ./logs:/app/logs
      - deepface-weights:/root/.deepface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: name-that-face-client
    ports:
      - "8501:8501"
    environment:
      # Points the Streamlit app at the API container by service name
      API_BASE_URL: http://api:8000
      # Client configuration (test defaults; override as needed)
      JWT_SECRET: test-secret-change-me
      USER_ID: test-user-1
      USERNAME: test@example.com
      USER_NAME: Test User
      USER_EMAIL: test@example.com
      USER_AGE: "25"
      CLIENT_LOG_PATH: /tmp/name_that_face_client.log
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Named volume so ArcFace/FaceNet weights (~600 MB) survive image rebuilds
  deepface-weights:
