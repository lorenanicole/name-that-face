[tool.poetry]
name = "name-that-face"
version = "0.1.0"
description = "Name-that-face: deepfake detection MVP — FastAPI + Duo 2FA + DeepFace identity verification"
authors = ["Lorena Mesa <me@lorenamesa.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = { version = "^0.52.1", extras = ["standard"] }
pydantic = "^2.13.4"
pydantic-settings = "^2.15.0"
pyjwt = "^2.13.0"
pyyaml = "^6.0.3"
duo-client = "^5.6.1"
structlog = "^26.1.0"
streamlit = "^1.61.1"
requests = "^2.34.2"
python-multipart = "^0.0.32"
email-validator = "^2.3.0"
python-dotenv = "*"
pytesseract = "^0.3.10"
pillow = "^10.0"
pillow-heif = "^0.7.0"
streamlit-browser-engine = "^0.0.3"
opencv-python = "^4.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
httpx = "^0.27"
invoke = "^2.2"
ruff = "^0.9"
pre-commit = "^4.0"

# ---------------------------------------------------------------------------
# deepface group — managed separately in /Users/lorenamesa/Workspace/deepface-venv
# (Python 3.12 venv; TensorFlow is incompatible with 3.13 so kept isolated)
#
# To recreate the venv from scratch:
#   python3.12 -m venv /Users/lorenamesa/Workspace/deepface-venv
#   source /Users/lorenamesa/Workspace/deepface-venv/bin/activate
#   pip install -r deepface-requirements.txt
#
# fraud_detection_service.py calls this venv via subprocess, so it never
# needs to be active while running the main FastAPI server.
# ---------------------------------------------------------------------------
[tool.poetry.group.deepface]
optional = true

[tool.poetry.group.deepface.dependencies]
deepface = "^0.0.100"
tensorflow-cpu = "^2.16.2"
tf-keras = "^2.16.0"
opencv-python = "^4.11.0.86"
mtcnn = "^1.0.0"
retina-face = "^0.0.18"
numpy = "^1.26.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no I/O, no network (select with '-m unit')",
    "integration: exercises the full FastAPI app via TestClient (select with '-m integration')",
]



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]   # pycodestyle errors/warnings, pyflakes, isort
ignore = ["E501"]               # line length handled by formatter, not linter
